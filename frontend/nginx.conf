# Отдаёт собранный интерфейс и проксирует API платформе.
#
# Фронтенд и API живут на одном origin, поэтому CORS не нужен, а браузер
# не делает предзапросов.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Заголовки безопасности. CSP разрешает скрипты, стили, шрифты и запросы
    # только с собственного origin: даже если в интерфейс попадёт чужая
    # разметка из данных, браузер не выполнит её скрипт и не отправит
    # данные на сторонний адрес. 'unsafe-inline' для стилей нужен атрибутам
    # style, которыми движок графиков задаёт цвета.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Файлы сборки содержат хеш в имени — их можно кешировать надолго.
    location /assets/ {
        expires 1y;
        # add_header внутри location отменяет заголовки уровня server,
        # поэтому заголовки безопасности повторены здесь.
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Агент планирует SQL, выполняет его и при ошибке переписывает —
        # ответ может готовиться минуты. Таймауты согласованы с
        # HTTP_REQUEST_TIMEOUT платформы.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Загрузка CSV: предел согласован с INGEST_MAX_UPLOAD_MB.
        client_max_body_size 512m;
        proxy_request_buffering off;
    }

    # Навигация на стороне клиента: любой неизвестный путь отдаёт страницу.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
