# Локальный стенд платформы. Внешние сервисы не требуются:
# PostgreSQL, интерфейс и языковая модель поднимаются рядом.
#
# Точка входа — frontend: он отдаёт интерфейс и проксирует /api в api.
# Порт api наружу оставлен для curl и отладки.
#
# В этом файле нет ни одного собственного значения: всё приходит из
# окружения, и без него стенд не поднимется. Умолчаний нет намеренно —
# молча стартовать с учётными данными вроде aibi:aibi хуже, чем не
# стартовать вовсе. Начните с `cp .env.example .env`.
#
# Запись ${ПЕРЕМЕННАЯ:?...} требует непустого значения,
# запись ${ПЕРЕМЕННАЯ?...} — только объявленного: так LLM_API_KEY может
# быть пустым для локальной модели, но его нельзя просто забыть.
#
# Версии образов закреплены, а не вынесены в окружение: это фиксация
# зависимостей, как go.mod, а не настройка развёртывания.

services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?нужно задать POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нужно задать POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?нужно задать POSTGRES_DB}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:?нужно задать POSTGRES_INITDB_ARGS}
    # Настройки под аналитическую нагрузку на одной машине.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:?нужно задать PG_SHARED_BUFFERS}
      - -c
      - work_mem=${PG_WORK_MEM:?нужно задать PG_WORK_MEM}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:?нужно задать PG_MAINTENANCE_WORK_MEM}
      - -c
      - max_parallel_workers_per_gather=${PG_MAX_PARALLEL_WORKERS:?нужно задать PG_MAX_PARALLEL_WORKERS}
      - -c
      - jit=${PG_JIT:?нужно задать PG_JIT}
    ports:
      - "${POSTGRES_PORT:?нужно задать POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Миграции схемы. Отдельный шаг, а не часть старта приложения: так
  # понятно, кто и когда меняет базу, и откат делается тем же инструментом.
  migrate:
    image: migrate/migrate:v4.19.0
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      args:
        VERSION: ${VERSION:?нужно задать VERSION}
    environment:
      # Учётные данные живут в одном месте — в переменных POSTGRES_*.
      # Строка подключения собирается из них, чтобы не было второго
      # источника правды, который рано или поздно разойдётся.
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
      APP_ENV: ${APP_ENV:?нужно задать APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL:?нужно задать LOG_LEVEL}
      LOG_JSON: ${LOG_JSON:?нужно задать LOG_JSON}
      RAW_SCHEMA: ${RAW_SCHEMA:?нужно задать RAW_SCHEMA}
      HTTP_ADDR: ":8080"
      HTTP_REQUEST_TIMEOUT: ${HTTP_REQUEST_TIMEOUT:?нужно задать HTTP_REQUEST_TIMEOUT}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:?нужно задать HTTP_WRITE_TIMEOUT}
      QUERY_MAX_ROWS: ${QUERY_MAX_ROWS:?нужно задать QUERY_MAX_ROWS}
      QUERY_TIMEOUT: ${QUERY_TIMEOUT:?нужно задать QUERY_TIMEOUT}
      INGEST_MAX_UPLOAD_MB: ${INGEST_MAX_UPLOAD_MB:?нужно задать INGEST_MAX_UPLOAD_MB}
      LLM_ENABLED: ${LLM_ENABLED:?нужно задать LLM_ENABLED}
      LLM_BASE_URL: ${LLM_BASE_URL:?нужно задать LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL:?нужно задать LLM_MODEL}
      # Ключ может быть пустым — локальной модели он не нужен, — но
      # объявить его обязан каждый, кто поднимает стенд.
      LLM_API_KEY: ${LLM_API_KEY?нужно объявить LLM_API_KEY, допустимо пустым}
    ports:
      - "${API_PORT:?нужно задать API_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:?нужно задать FRONTEND_PORT}:80"
    depends_on:
      api:
        condition: service_started

  # Локальная модель. Профиль llm включается явно:
  #   docker compose --profile llm up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports:
      - "${OLLAMA_PORT:?нужно задать OLLAMA_PORT}:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
